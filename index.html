<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCataract-X</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 40%),
          linear-gradient(135deg, #0f172a, #1e293b);
      }

      .container {
        width: min(92vw, 760px);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 3vw, 2.6rem);
      }

      .subtitle {
        color: #cbd5e1;
        margin: 0 0 22px;
      }

      .upload-card {
        display: grid;
        place-items: center;
        gap: 10px;
        border: 2px dashed #64748b;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
        cursor: pointer;
        background: rgba(30, 41, 59, 0.65);
        min-height: 120px;
      }

      .upload-card:hover {
        border-color: #38bdf8;
      }

      .upload-card input {
        display: none;
      }

      #preview {
        display: block;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        margin: 18px 0 0;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.5);
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result-box {
        margin-top: 22px;
        padding: 18px;
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .result-box h2 {
        margin-top: 0;
      }

      .muted {
        color: #94a3b8;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>OmniCataract-X</h1>
      <p class="subtitle">Upload a fundus image to run the cataract screening analysis.</p>

      <label class="upload-card" for="imageInput">
        <input id="imageInput" type="file" accept="image/*" />
        <span id="uploadHint">Choose an image</span>
      </label>

      <img id="preview" alt="Preview" hidden />

      <div class="actions">
        <button id="analyzeBtn" type="button">Analyze</button>
        <span class="muted">Backend: Render API</span>
      </div>

      <section id="resultBox" class="result-box" hidden>
        <h2>Result</h2>
        <div id="resultText"></div>
      </section>
    </main>

    <script>
      const backendUrl = "https://omnicataract-x-api.onrender.com";

      const imageInput = document.getElementById("imageInput");
      const uploadHint = document.getElementById("uploadHint");
      const preview = document.getElementById("preview");
      const analyzeBtn = document.getElementById("analyzeBtn");
      const resultBox = document.getElementById("resultBox");
      const resultText = document.getElementById("resultText");

      let selectedFile = null;

      imageInput.addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        selectedFile = file;
        uploadHint.textContent = file.name;

        const reader = new FileReader();
        reader.onload = () => {
          preview.src = reader.result;
          preview.hidden = false;
        };
        reader.readAsDataURL(file);
      });

      analyzeBtn.addEventListener("click", async () => {
        if (!selectedFile) {
          alert("Please choose an image first.");
          return;
        }

        analyzeBtn.disabled = true;
        resultBox.hidden = false;
        resultText.textContent = "Analyzing...";

        try {
          const formData = new FormData();
          formData.append("file", selectedFile);

          const response = await fetch(`${backendUrl}/predict`, {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const error = await response.text();
            throw new Error(error || "Request failed");
          }

          const result = await response.json();
          resultText.innerHTML = `
            <p><strong>Cataract detected:</strong> ${result.cataract_detected ? "Yes" : "No"}</p>
            <p><strong>Confidence:</strong> ${(result.cataract_confidence * 100).toFixed(1)}%</p>
            <p><strong>Quality:</strong> ${result.quality_status}</p>
            <p><strong>Severity:</strong> ${result.severity_grade}</p>
            <p><strong>Message:</strong> ${result.message}</p>
          `;
        } catch (error) {
          resultText.textContent = `Error: ${error.message}`;
        } finally {
          analyzeBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
